appId: com.notamentor.app
productName: NotaMentor
copyright: Copyright © 2026 NotaMentor
directories:
  output: release
  buildResources: build
afterAllArtifactBuild: build/afterAllArtifactBuild.cjs
files:
  - out/**/*
  - package.json
asar: true
# Task Manager shows the exe's FileDescription, which electron-builder takes from "description".
extraMetadata:
  description: NotaMentor
extraResources:
  - from: build/icon.ico
    to: icon.ico
extraFiles:
  - from: build/icon.ico
    to: NotaMentor.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: NotaMentor-Setup-${version}.exe
  # Writes the icon and version info into NotaMentor.exe; with no certificate, signing itself is skipped.
  signAndEditExecutable: true
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: NotaMentor
  uninstallDisplayName: NotaMentor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages:
    - ru_RU
    - en_US
  language: 1049
  displayLanguageSelector: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  packElevateHelper: true
portable:
  artifactName: NotaMentor-Portable-${version}.exe
